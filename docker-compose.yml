  scheduler:
    build:
      context: ./Data-Extractor
      dockerfile: Dockerfile.scheduler
    container_name: mindmap-scheduler
    restart: unless-stopped
    env_file:
      - ./Data-Extractor/.env
    environment:
      MONGO_HOST: mongo
      MONGO_PORT: "27017"
    depends_on:
      - mongo
    volumes:
      - scheduler-logs:/app/logs

volumes:
  mongo-data:
  scheduler-logs:
